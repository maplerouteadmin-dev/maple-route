name: Linux AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: maple-route-linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
      - name: Attach AppImage to the approved release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.AppImage --clobber
